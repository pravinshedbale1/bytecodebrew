<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ByteCodeBrew — Interview preparation, in depth</title>
    <meta name="description" content="Free, in-depth interview preparation: system design (HLD and LLD), DSA patterns in Java with 314 problems you can solve with tests, and behavioral interviews." />
    <meta property="og:title" content="ByteCodeBrew — Interview preparation, in depth" />
    <meta property="og:description" content="System design, DSA patterns with judged practice problems, and behavioral interview prep." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bytecodebrew.com/" />
    <meta property="og:image" content="https://bytecodebrew.com/og.png" />
    <meta name="theme-color" content="#1f6f6b" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bcb:theme');
        if (t) document.documentElement.dataset.theme = t;
        // the visual style (experiment): ?look=glass|classic switches it and is remembered
        var q = new URLSearchParams(location.search).get('look');
        if (q === 'glass' || q === 'classic') localStorage.setItem('bcb:look', q);
        if (localStorage.getItem('bcb:look') === 'glass') document.documentElement.dataset.look = 'glass';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
