<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ByteCodeBrew — Interview preparation, in depth</title>
    <meta name="description" content="Free, in-depth interview preparation: system design (HLD and LLD), DSA patterns in Java with 314 problems you can solve with tests, and behavioral interviews." />
    <meta property="og:title" content="ByteCodeBrew — Interview preparation, in depth" />
    <meta property="og:description" content="System design, DSA patterns with judged practice problems, and behavioral interview prep." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bytecodebrew.com/" />
    <meta property="og:image" content="https://bytecodebrew.com/og.png" />
    <meta name="theme-color" content="#1f6f6b" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bcb:theme');
        if (t) document.documentElement.dataset.theme = t;
        // the visual style (experiment): ?look=glass|classic switches it and is remembered
        var q = new URLSearchParams(location.search).get('look');
        if (q === 'glass' || q === 'classic') localStorage.setItem('bcb:look', q);
        if (localStorage.getItem('bcb:look') === 'glass') document.documentElement.dataset.look = 'glass';
      } catch (e) {}
      // A loading screen until the app has drawn its first frame (src/main.jsx removes it).
      // It also covers the plain-HTML copy of the page that crawlers read. If the app never
      // starts (a failed download), the screen steps aside after 10 s so that copy shows instead.
      document.documentElement.classList.add('booting');
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (b) { b.remove(); document.documentElement.classList.remove('booting'); }
      }, 10000);
    </script>
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #f8f7f4; transition: opacity 0.18s ease-out; }
      :root[data-theme='dark'] #boot { background: #15171a; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #boot { background: #15171a; } }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot svg, #boot i { animation: boot-in 0.25s ease-out 0.12s backwards; }
      #boot i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(31, 111, 107, 0.18); border-top-color: #1f6f6b; animation: boot-in 0.25s ease-out 0.12s backwards, boot-spin 0.8s linear infinite; }
      :root[data-theme='dark'] #boot i { border-color: rgba(108, 186, 179, 0.2); border-top-color: #6cbab3; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #boot i { border-color: rgba(108, 186, 179, 0.2); border-top-color: #6cbab3; } }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .booting .seo-static { visibility: hidden; }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading ByteCodeBrew">
      <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1f6f6b"/><path d="M11 10l-5 6 5 6M21 10l5 6-5 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <i aria-hidden="true"></i>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
