name = "bytecodebrew-payments"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "bytecodebrew-53f0c"
SITE_URL = "https://bytecodebrew.com"
PUBLIC_URL = "https://bytecodebrew-payments.bytecodebrew.workers.dev"
# Razorpay test or live mode follows the key: rzp_test_… moves no real money, rzp_live_… does.

# Secrets (never in this file) — set once with:
#   npx wrangler@4 secret put RAZORPAY_KEY_ID
#   npx wrangler@4 secret put RAZORPAY_KEY_SECRET
#   npx wrangler@4 secret put RAZORPAY_WEBHOOK_SECRET
#   npx wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT   (the whole service-account JSON; already set)
